<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Class 10 Bengali MCQ | Shikha Sahayak</title>
  <link rel="stylesheet" href="../style.css"/>
</head>
<body>

<header class="header">
  <h1>Class 10 Bengali MCQ / শ্রেণি ১০ বাংলা এমসিকিউ</h1>
  <p>WB Board Practice Test / পশ্চিমবঙ্গ বোর্ড প্র্যাকটিস</p>
</header>

<nav class="nav">
  <a href="../index.html">Home / হোম</a>
  <a href="../mcq.html">MCQ / এমসিকিউ</a>
</nav>

<main class="container section">
  <form id="quizForm">

    <p><b>1) “গীতাঞ্জলি” কার লেখা?</b> (Who wrote Geetanjali?)</p>
    <label><input type="radio" name="q1" value="1"> রবীন্দ্রনাথ ঠাকুর (Rabindranath Tagore)</label><br>
    <label><input type="radio" name="q1" value="0"> কাজী নজরুল ইসলাম</label><br>
    <label><input type="radio" name="q1" value="0"> বঙ্কিমচন্দ্র চট্টোপাধ্যায়</label><br><br>

    <p><b>2) রবীন্দ্রনাথ কত সালে নোবেল পান?</b> (When did Tagore win Nobel?)</p>
    <label><input type="radio" name="q2" value="1"> 1913</label><br>
    <label><input type="radio" name="q2" value="0"> 1905</label><br>
    <label><input type="radio" name="q2" value="0"> 1920</label><br><br>

    <button type="button" class="card" onclick="checkResult()">Submit / জমা দিন</button>
  </form>

  <h3 id="result"></h3>
</main>

<script>
  function checkResult(){
    let score = 0;
    const q1 = document.querySelector('input[name="q1"]:checked');
    const q2 = document.querySelector('input[name="q2"]:checked');

    if(q1) score += Number(q1.value);
    if(q2) score += Number(q2.value);

    document.getElementById("result").innerText =
      "✅ Your Score / আপনার স্কোর: " + score + "/2";
  }
</script>

</body>
</html>
